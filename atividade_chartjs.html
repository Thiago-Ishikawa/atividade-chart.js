<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade Chart.Js</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="display: flex; justify-content: center; min-height: 100vh; align-items: center;">
    <div>
  <canvas id="myChart1" style="position: relative; height: 40vh; width: 40vw;"></canvas>
    </div>
    <div>
  <canvas id="myChart2" style="position: relative; height: 40vh; width: 40vw;"></canvas>
    </div>
</body>

<script>

const labels = [
    '12:00',
    '13:00',
    '14:00',
    '15:00',
    '16:00',
    '17:00',
];

const labels2 = [
    'Janeiro',
    'Fevereiro',
    'Março',
    'Abril',
    'Maio',
    'Junho',
];

const data = {
  labels: labels,
  datasets: [{
    label: 'Temperatura',
    data: [30, 29, 28, 25, 22, 23],
    backgroundColor: 'rgb(255, 99, 132)',
    borderColor: 'rgb(255, 99, 132)',
  },
  {
    label: 'Umidade',
    data: [80, 82, 80, 85, 80, 83],
    backgroundColor: 'rgb(54, 162, 235)',
    borderColor: 'rgb(54, 162, 235)',
  
  }]
};

const data2 = {
  labels: labels2,
  datasets: [{
    label: 'Temperatura Média',
    data: [22, 24, 27, 23, 20, 18],
    backgroundColor: 'rgb(255, 99, 132)',
    borderColor: 'rgb(255, 99, 132)',
  },
  {
    label: 'Umidade Média',
    data: [90, 89, 93, 87, 88, 82],
    backgroundColor: 'rgb(54, 162, 235)',
    borderColor: 'rgb(54, 162, 235)',
  
  }]
};
const config = {
  type: 'line',
  data: data,
};

const config2 = {
  type: 'bar',
  data: data2,
};

</script>

<script>
    const myChart1 = new Chart(
      document.getElementById("myChart1"),
      config
    );

    const myChart2 = new Chart(
      document.getElementById("myChart2"),
      config2
    );

</script>

</html>
